<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語音掃描助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'PingFang HK', 'Microsoft JhengHei', sans-serif; }
        .spinner { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 隱藏預設的 input file 樣式 */
        input[type="file"] { display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <div class="max-w-2xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2"><i class="fa-solid fa-language mr-2"></i>語音掃描助手</h1>
            <p class="text-gray-500 text-sm">拍照或上傳圖片，自動擷取文字並用語音朗讀</p>
        </header>

        <!-- Section 1: Image Input & OCR -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">1. 獲取文字</h2>
            
            <div class="flex flex-col sm:flex-row gap-4 mb-4">
                <label class="flex-1 cursor-pointer bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 rounded-xl p-4 flex flex-col items-center justify-center transition-colors">
                    <i class="fa-solid fa-camera text-2xl mb-2"></i>
                    <span class="font-medium">拍照 / 選取圖片</span>
                    <input type="file" id="imageInput" accept="image/*" capture="environment">
                </label>
            </div>

            <!-- Image Preview -->
            <div id="imagePreviewContainer" class="hidden mb-4 relative rounded-xl overflow-hidden bg-gray-100 border border-gray-200">
                <img id="imagePreview" src="" alt="預覽圖片" class="w-full max-h-64 object-contain">
                <button id="clearImageBtn" class="absolute top-2 right-2 bg-gray-800 bg-opacity-70 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-red-500 transition-colors">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>

            <!-- OCR Loading State -->
            <div id="ocrLoading" class="hidden flex-col items-center justify-center p-6 bg-blue-50 rounded-xl">
                <div class="spinner border-4 border-blue-200 border-solid rounded-full w-10 h-10 mb-3"></div>
                <p class="text-blue-600 font-medium">正在識別文字中 (AI OCR)...</p>
            </div>

            <!-- Text Area -->
            <div class="relative">
                <textarea id="extractedText" rows="6" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y transition-all" placeholder="識別出的文字會顯示在這裡，你也可以手動編輯..."></textarea>
            </div>
        </section>

        <!-- Section 2: Text-to-Speech (TTS) -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">2. 語音朗讀設定</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- Voice Selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">選擇語言 / 口音</label>
                    <div class="relative">
                        <select id="voiceSelect" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl appearance-none focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="">載入語音中...</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                            <i class="fa-solid fa-chevron-down text-sm"></i>
                        </div>
                    </div>
                </div>

                <!-- Speed Selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">朗讀速度</label>
                    <div class="flex bg-gray-50 border border-gray-200 rounded-xl overflow-hidden p-1">
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="speed" value="0.5" class="peer sr-only">
                            <div class="py-2 text-sm font-medium rounded-lg peer-checked:bg-blue-100 peer-checked:text-blue-700 text-gray-600 transition-colors">慢 (0.5x)</div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="speed" value="1.0" class="peer sr-only" checked>
                            <div class="py-2 text-sm font-medium rounded-lg peer-checked:bg-blue-100 peer-checked:text-blue-700 text-gray-600 transition-colors">正常 (1.0x)</div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="speed" value="1.5" class="peer sr-only">
                            <div class="py-2 text-sm font-medium rounded-lg peer-checked:bg-blue-100 peer-checked:text-blue-700 text-gray-600 transition-colors">快 (1.5x)</div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="flex justify-center items-center gap-4">
                <button id="playBtn" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-transform transform active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> 播放
                </button>
                <button id="pauseBtn" class="flex-none bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-transform transform active:scale-95 flex items-center justify-center gap-2 hidden">
                    <i class="fa-solid fa-pause"></i> 暫停
                </button>
                <button id="resumeBtn" class="flex-none bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-transform transform active:scale-95 flex items-center justify-center gap-2 hidden">
                    <i class="fa-solid fa-play"></i> 繼續
                </button>
                <button id="stopBtn" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-transform transform active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-stop"></i> 停止
                </button>
            </div>
        </section>
        
        <footer class="mt-8 text-center text-xs text-gray-400">
            Powered by Gemini AI OCR & Web Speech API
        </footer>
    </div>

    <script>
        // DOM Elements
        const imageInput = document.getElementById('imageInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const clearImageBtn = document.getElementById('clearImageBtn');
        const ocrLoading = document.getElementById('ocrLoading');
        const extractedText = document.getElementById('extractedText');
        
        const voiceSelect = document.getElementById('voiceSelect');
        const speedRadios = document.getElementsByName('speed');
        
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const stopBtn = document.getElementById('stopBtn');

        // State
        let synth = window.speechSynthesis;
        let voices = [];
        let currentUtterance = null;

        // --- 1. OCR (Gemini API) Logic ---
        
        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Show preview
            const reader = new FileReader();
            reader.onload = async (event) => {
                const base64DataWithPrefix = event.target.result;
                imagePreview.src = base64DataWithPrefix;
                imagePreviewContainer.classList.remove('hidden');
                
                // Extract base64 without prefix for API
                const base64Data = base64DataWithPrefix.split(',')[1];
                await performOCR(base64Data, file.type);
            };
            reader.readAsDataURL(file);
        });

        clearImageBtn.addEventListener('click', () => {
            imageInput.value = '';
            imagePreview.src = '';
            imagePreviewContainer.classList.add('hidden');
            extractedText.value = '';
        });

        async function performOCR(base64Data, mimeType) {
            ocrLoading.classList.remove('hidden');
            extractedText.classList.add('opacity-50');
            
            try {
                // Using the unified generation endpoint with empty key for runtime injection
                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const prompt = "Extract all text from this image, preserving the original language (Chinese/English) and formatting. Only return the extracted text. Do not add any markdown formatting or explanations.";
                
                const payload = {
                    contents: [
                        {
                            role: "user",
                            parts: [
                                { text: prompt },
                                {
                                    inlineData: {
                                        mimeType: mimeType,
                                        data: base64Data
                                    }
                                }
                            ]
                        }
                    ]
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0 && result.candidates[0].content) {
                    const text = result.candidates[0].content.parts[0].text;
                    extractedText.value = text.trim();
                } else {
                    extractedText.value = "無法識別圖片中的文字，請重試。";
                    console.error("API Error:", result);
                }
            } catch (error) {
                console.error("OCR Fetch Error:", error);
                extractedText.value = "發生連線錯誤，無法進行識別。";
            } finally {
                ocrLoading.classList.add('hidden');
                extractedText.classList.remove('opacity-50');
            }
        }

        // --- 2. Text-to-Speech (TTS) Logic ---

        function populateVoiceList() {
            voices = synth.getVoices();
            if (voices.length === 0) return;

            voiceSelect.innerHTML = '';
            
            // Organize voices by priority
            const cantoneseVoices = [];
            const englishVoices = { US: [], GB: [], AU: [], IN: [], CA: [], Other: [] };
            const otherVoices = [];

            voices.forEach(voice => {
                const lang = voice.lang.toLowerCase();
                const name = voice.name;

                if (lang.includes('zh-hk') || lang.includes('yue')) {
                    cantoneseVoices.push(voice);
                } else if (lang.startsWith('en-')) {
                    if (lang.includes('us')) englishVoices.US.push(voice);
                    else if (lang.includes('gb') || lang.includes('uk')) englishVoices.GB.push(voice);
                    else if (lang.includes('au')) englishVoices.AU.push(voice);
                    else if (lang.includes('in')) englishVoices.IN.push(voice);
                    else if (lang.includes('ca')) englishVoices.CA.push(voice);
                    else englishVoices.Other.push(voice);
                } else if (lang.includes('zh-tw') || lang.includes('zh-cn')) {
                     otherVoices.push(voice); // Keep other Chinese dialects near the bottom
                } else {
                    // Ignore other random languages to keep UI clean, or add them if needed.
                }
            });

            // Helper to create options
            const createOptGroup = (label, voiceArray) => {
                if (voiceArray.length === 0) return;
                const group = document.createElement('optgroup');
                group.label = label;
                voiceArray.forEach(voice => {
                    const option = document.createElement('option');
                    option.textContent = `${voice.name} (${voice.lang})`;
                    if (voice.default) option.textContent += ' — Default';
                    option.value = voice.name;
                    group.appendChild(option);
                });
                voiceSelect.appendChild(group);
            };

            createOptGroup('🇭🇰 廣東話 (Cantonese)', cantoneseVoices);
            createOptGroup('🇺🇸 英語 (美國口音)', englishVoices.US);
            createOptGroup('🇬🇧 英語 (英國口音)', englishVoices.GB);
            createOptGroup('🇦🇺 英語 (澳洲口音)', englishVoices.AU);
            createOptGroup('🇮🇳 英語 (印度口音)', englishVoices.IN);
            createOptGroup('🇨🇦 英語 (加拿大口音)', englishVoices.CA);
            createOptGroup('🌍 英語 (其他口音)', englishVoices.Other);
            createOptGroup('🌐 國語/普通話', otherVoices);

            // Select Cantonese by default if available
            if (cantoneseVoices.length > 0) {
                voiceSelect.value = cantoneseVoices[0].name;
            } else if (englishVoices.US.length > 0) {
                voiceSelect.value = englishVoices.US[0].name;
            }
        }

        // Handle voice loading (some browsers load async)
        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        // Play Controls
        function getSelectedSpeed() {
            for (const radio of speedRadios) {
                if (radio.checked) return parseFloat(radio.value);
            }
            return 1.0;
        }

        function updateUIState(state) {
            if (state === 'playing') {
                playBtn.classList.add('hidden');
                pauseBtn.classList.remove('hidden');
                resumeBtn.classList.add('hidden');
            } else if (state === 'paused') {
                playBtn.classList.add('hidden');
                pauseBtn.classList.add('hidden');
                resumeBtn.classList.remove('hidden');
            } else { // stopped
                playBtn.classList.remove('hidden');
                pauseBtn.classList.add('hidden');
                resumeBtn.classList.add('hidden');
            }
        }

        playBtn.addEventListener('click', () => {
            if (synth.speaking && synth.paused) {
                synth.resume();
                updateUIState('playing');
                return;
            }
            
            synth.cancel(); // Stop anything playing
            
            const textToSpeak = extractedText.value;
            if (!textToSpeak.trim()) {
                alert("請先輸入或掃描文字！");
                return;
            }

            currentUtterance = new SpeechSynthesisUtterance(textToSpeak);
            
            // Set Voice
            const selectedVoiceName = voiceSelect.value;
            const voice = voices.find(v => v.name === selectedVoiceName);
            if (voice) {
                currentUtterance.voice = voice;
            }

            // Set Speed
            currentUtterance.rate = getSelectedSpeed();
            
            // Events
            currentUtterance.onstart = () => updateUIState('playing');
            currentUtterance.onend = () => updateUIState('stopped');
            currentUtterance.onerror = (e) => {
                if(e.error !== 'canceled') {
                    console.error("TTS Error:", e);
                }
                updateUIState('stopped');
            };

            synth.speak(currentUtterance);
        });

        pauseBtn.addEventListener('click', () => {
            if (synth.speaking) {
                synth.pause();
                updateUIState('paused');
            }
        });

        resumeBtn.addEventListener('click', () => {
            if (synth.paused) {
                synth.resume();
                updateUIState('playing');
            }
        });

        stopBtn.addEventListener('click', () => {
            synth.cancel();
            updateUIState('stopped');
        });

        // Ensure speech synthesis stops when window is closed/refreshed
        window.addEventListener('beforeunload', () => {
            synth.cancel();
        });

    </script>
</body>
</html>
