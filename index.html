<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>語音掃描助手 - 智能默書版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .loading-pulse { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    textarea::selection { background: #c7d2fe; color: #312e81; }
    
    /* 將隱藏的 input 改為絕對定位但不可見，以避免某些瀏覽器攔截 */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-pen-clip text-2xl"></i>
        <h1 class="text-lg font-bold">智能默書掃描助手</h1>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-4 space-y-4">

    <!-- 步驟 1: 拍照 / 上傳圖片 -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">
        1. 獲取相片 (拍照或相簿)
      </h2>

      <!-- 修復重點：使用 label 包裹 input，這是移動端最可靠的觸發方式 -->
      <div class="grid grid-cols-2 gap-3 mb-3">
        
        <!-- 即時拍照按鈕 -->
        <label for="cameraInput" class="cursor-pointer flex flex-col items-center justify-center p-4 bg-indigo-50 hover:bg-indigo-100 active:scale-95 text-indigo-700 rounded-xl border border-indigo-200 transition">
          <i class="fa-solid fa-camera text-2xl mb-1"></i>
          <span class="text-sm font-semibold">即時拍照</span>
          <input type="file" id="cameraInput" accept="image/*" capture="environment" class="visually-hidden">
        </label>

        <!-- 從相簿選取按鈕 -->
        <label for="galleryInput" class="cursor-pointer flex flex-col items-center justify-center p-4 bg-emerald-50 hover:bg-emerald-100 active:scale-95 text-emerald-700 rounded-xl border border-emerald-200 transition">
          <i class="fa-solid fa-images text-2xl mb-1"></i>
          <span class="text-sm font-semibold">從相簿選取</span>
          <!-- 移除了 capture 屬性，確保彈出相簿選項 -->
          <input type="file" id="galleryInput" accept="image/jpeg, image/png, image/jpg" class="visually-hidden">
        </label>

      </div>

      <div id="previewContainer" class="hidden">
        <div class="relative rounded-xl overflow-hidden bg-slate-900 border border-slate-200 max-h-60 flex items-center justify-center">
          <img id="imagePreview" src="" alt="預覽圖片" class="max-h-60 w-full object-contain">
          <button id="btnRemoveImage" class="absolute top-2 right-2 bg-black/60 text-white rounded-full p-2 text-xs hover:bg-black/80">
            <i class="fa-solid fa-times"></i>
          </button>
        </div>
      </div>

      <div id="ocrProgressBox" class="hidden mt-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
        <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
          <span id="ocrStatusText">正在掃描文字...</span>
          <span id="ocrPercentText">處理中</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
          <div id="ocrProgressBar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 40%"></div>
        </div>
      </div>
    </div>

    <!-- 步驟 2: 識別文字結果 -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider">
          2. 掃描文字內容
        </h2>
        <button id="btnClearText" class="text-xs text-rose-500 hover:text-rose-700 font-medium">清空</button>
      </div>
      
      <textarea id="recognizedText" rows="6" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" placeholder="掃描後的文字會自動填入此處..."></textarea>
    </div>

    <!-- 步驟 3: 默書控制與設定 -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
      <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider">
        3. 默書控制與發音設定
      </h2>

      <div>
        <label for="voiceSelect" class="block text-xs font-semibold text-slate-600 mb-1">選擇語言 / 英語口音：</label>
        <select id="voiceSelect" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">載入系統語音中...</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-2">朗讀速度：</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" data-speed="0.75" class="speed-btn py-2 px-3 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">
            🐢 慢速 (0.75x)
          </button>
          <button type="button" data-speed="1.0" class="speed-btn py-2 px-3 rounded-lg border border-indigo-600 bg-indigo-50 text-xs font-semibold text-indigo-700">
            🚶 中速 (正常)
          </button>
          <button type="button" data-speed="1.3" class="speed-btn py-2 px-3 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">
            🏃 快速 (1.3x)
          </button>
        </div>
      </div>

      <!-- 默書專屬功能區 -->
      <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-xl mt-2 flex flex-col space-y-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <input type="checkbox" id="chkReadPunc" class="w-4 h-4 text-indigo-600 rounded border-slate-300 bg-white" checked>
            <label for="chkReadPunc" class="text-xs font-bold text-indigo-900">📝 默書模式 (讀出標點符號)</label>
          </div>
          <span id="sentenceProgress" class="text-[11px] bg-indigo-200 text-indigo-800 px-2 py-0.5 rounded-full font-bold hidden">第 0/0 句</span>
        </div>
        <p class="text-[10px] text-indigo-500 leading-tight">打勾後，按「讀下一句」時會自動讀出「逗號/句號/Comma/Full stop」等。</p>
      </div>

      <!-- 播放控制按鈕 -->
      <div class="pt-1 grid grid-cols-3 gap-2">
        <!-- 播放全部 -->
        <button id="btnPlay" class="col-span-1 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold py-3 px-2 rounded-xl transition flex flex-col items-center space-y-1">
          <i class="fa-solid fa-play text-lg"></i>
          <span class="text-[11px]">全部朗讀</span>
        </button>
        
        <!-- 讀下一句 -->
        <button id="btnNext" class="col-span-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3 px-2 rounded-xl shadow-md shadow-indigo-200 transition flex flex-col items-center space-y-1">
          <i class="fa-solid fa-forward-step text-lg"></i>
          <span class="text-[12px] tracking-wide">讀下一段 / 下一句</span>
        </button>
      </div>

      <!-- 停止/重設按鈕 -->
      <button id="btnStop" class="w-full mt-2 bg-rose-50 hover:bg-rose-100 border border-rose-200 active:scale-95 text-rose-600 font-bold py-2.5 rounded-xl transition text-xs flex items-center justify-center">
        <i class="fa-solid fa-stop mr-1.5"></i> 停止朗讀 / 重設進度
      </button>

    </div>

  </main>

  <canvas id="compressCanvas" class="hidden"></canvas>

  <script>
    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const btnRemoveImage = document.getElementById('btnRemoveImage');
    
    const ocrProgressBox = document.getElementById('ocrProgressBox');
    const ocrStatusText = document.getElementById('ocrStatusText');
    const ocrProgressBar = document.getElementById('ocrProgressBar');
    
    const recognizedText = document.getElementById('recognizedText');
    const btnClearText = document.getElementById('btnClearText');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedButtons = document.querySelectorAll('.speed-btn');
    
    const btnPlay = document.getElementById('btnPlay');
    const btnNext = document.getElementById('btnNext');
    const btnStop = document.getElementById('btnStop');
    const chkReadPunc = document.getElementById('chkReadPunc');
    const sentenceProgress = document.getElementById('sentenceProgress');
    const compressCanvas = document.getElementById('compressCanvas');

    let currentRate = 1.0;
    let availableVoices = [];
    
    const OCR_API_KEY = 'K87899142388957';
    let currentSentences = [];
    let currentIndex = 0;
    let lastText = "";

    // 處理圖片上傳
    cameraInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleImage(e.target.files[0]);
    });
    galleryInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleImage(e.target.files[0]);
    });

    btnRemoveImage.addEventListener('click', () => {
      previewContainer.classList.add('hidden');
      imagePreview.src = '';
      cameraInput.value = '';
      galleryInput.value = '';
    });

    btnClearText.addEventListener('click', () => {
      recognizedText.value = '';
      resetProgress();
    });

    function compressImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1200;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          compressCanvas.width = w;
          compressCanvas.height = h;
          const ctx = compressCanvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(compressCanvas.toDataURL('image/jpeg', 0.85));
        };
        const reader = new FileReader();
        reader.onload = (e) => img.src = e.target.result;
        reader.readAsDataURL(file);
      });
    }

    async function handleImage(file) {
      if (!file) return;
      const base64DataUrl = await compressImage(file);
      imagePreview.src = base64DataUrl;
      previewContainer.classList.remove('hidden');

      ocrProgressBox.classList.remove('hidden');
      ocrProgressBar.style.width = '30%';
      ocrStatusText.innerText = '正在上傳分析中...';
      resetProgress();

      try {
        const formData = new FormData();
        formData.append('base64Image', base64DataUrl);
        formData.append('language', 'cht'); 
        formData.append('isOverlayRequired', 'false');
        formData.append('detectOrientation', 'true');
        formData.append('scale', 'true');
        formData.append('OCREngine', '2');

        const response = await fetch('https://api.ocr.space/parse/image', {
          method: 'POST',
          headers: { 'apikey': OCR_API_KEY },
          body: formData
        });

        ocrProgressBar.style.width = '80%';
        const data = await response.json();

        if (data.ParsedResults && data.ParsedResults.length > 0) {
          const parsed = data.ParsedResults[0].ParsedText.trim();
          recognizedText.value = parsed || '（未能辨識文字）';
          ocrProgressBar.style.width = '100%';
          ocrStatusText.innerText = '掃描完成！';
        } else {
          throw new Error('解析失敗');
        }
      } catch (err) {
        alert('OCR 解析發生問題，請稍後再試。');
        ocrStatusText.innerText = '辨識出錯';
      }
      setTimeout(() => ocrProgressBox.classList.add('hidden'), 1000);
    }

    // 語音載入
    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
      if (!availableVoices.length) return;

      voiceSelect.innerHTML = '';
      const cantoneseVoices = [];
      const englishVoices = [];

      availableVoices.forEach(v => {
        const lang = v.lang.replace('_', '-');
        const name = v.name.toLowerCase();
        if (lang === 'zh-HK' || lang === 'yue' || lang === 'zh-yue' || name.includes('cantonese') || name.includes('hong kong') || name.includes('香港')) {
          cantoneseVoices.push(v);
        } else if (lang.startsWith('en')) {
          englishVoices.push(v);
        }
      });

      const cantoneseGroup = document.createElement('optgroup');
      cantoneseGroup.label = '🇭🇰 粵語 (Cantonese)';
      cantoneseVoices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name; opt.textContent = `粵語 - ${v.name}`;
        cantoneseGroup.appendChild(opt);
      });
      if (!cantoneseVoices.length) cantoneseGroup.innerHTML = '<option value="">無專屬粵語 (預設中文)</option>';
      voiceSelect.appendChild(cantoneseGroup);

      const englishGroup = document.createElement('optgroup');
      englishGroup.label = '🌐 英語口音 (English)';
      englishVoices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name; opt.textContent = `英語 - ${v.name}`;
        englishGroup.appendChild(opt);
      });
      voiceSelect.appendChild(englishGroup);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    speedButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        speedButtons.forEach(b => b.className = 'speed-btn py-2 px-3 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50');
        btn.className = 'speed-btn py-2 px-3 rounded-lg border border-indigo-600 bg-indigo-50 text-xs font-semibold text-indigo-700';
        currentRate = parseFloat(btn.dataset.speed);
      });
    });

    // ========== 默書核心邏輯 ========== //

    function resetProgress() {
      currentIndex = 0;
      lastText = "";
      sentenceProgress.classList.add('hidden');
    }

    function splitTextIntoChunks(text) {
      const regex = /[^，。！？；：,.!?;:\n]+[，。！？；：,.!?;:\n]*/g;
      const arr = text.match(regex);
      if (!arr) return [text];
      return arr.map(s => s.trim()).filter(s => s.length > 0);
    }

    function processDictationPunctuation(text, voiceLang) {
      const isEnglish = voiceLang.startsWith('en');
      if (isEnglish) {
        return text
          .replace(/,/g, ' comma, ')
          .replace(/，/g, ' comma, ')
          .replace(/\./g, ' full stop. ')
          .replace(/。/g, ' full stop. ')
          .replace(/\?/g, ' question mark? ')
          .replace(/？/g, ' question mark? ')
          .replace(/!/g, ' exclamation mark! ')
          .replace(/！/g, ' exclamation mark! ')
          .replace(/:/g, ' colon: ')
          .replace(/：/g, ' colon: ')
          .replace(/;/g, ' semi colon; ')
          .replace(/；/g, ' semi colon; ')
          .replace(/"(.*?)"/g, ' quote, $1, unquote. ')
          .replace(/「(.*?)」/g, ' quote, $1, unquote. ')
          .replace(/\n/g, ' new line. ');
      } else {
        return text
          .replace(/,/g, ' 逗號， ')
          .replace(/，/g, ' 逗號， ')
          .replace(/\./g, ' 句號。 ')
          .replace(/。/g, ' 句號。 ')
          .replace(/\?/g, ' 問號？ ')
          .replace(/？/g, ' 問號？ ')
          .replace(/!/g, ' 感嘆號！ ')
          .replace(/！/g, ' 感嘆號！ ')
          .replace(/:/g, ' 冒號： ')
          .replace(/：/g, ' 冒號： ')
          .replace(/;/g, ' 分號； ')
          .replace(/；/g, ' 分號； ')
          .replace(/"(.*?)"/g, ' 開引號，$1，關引號。 ')
          .replace(/「(.*?)」/g, ' 開引號，$1，關引號。 ')
          .replace(/\n/g, ' 開新行。 ');
      }
    }

    function speakText(textToRead, isNextBtnMode) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.rate = currentRate;

      const selectedVoiceName = voiceSelect.value;
      let voiceLang = 'zh-HK'; 
      if (selectedVoiceName) {
        const found = availableVoices.find(v => v.name === selectedVoiceName);
        if (found) {
          utterance.voice = found;
          voiceLang = found.lang;
        }
      }

      if (chkReadPunc.checked) {
        utterance.text = processDictationPunctuation(textToRead, voiceLang);
      }

      utterance.onstart = () => {
        if (isNextBtnMode) {
          btnNext.classList.add('loading-pulse');
          btnNext.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-lg"></i><span class="text-[12px]">正在朗讀...</span>';
        } else {
          btnPlay.classList.add('loading-pulse');
        }
      };
      utterance.onend = utterance.onerror = () => {
        btnNext.classList.remove('loading-pulse');
        btnNext.innerHTML = '<i class="fa-solid fa-forward-step text-lg"></i><span class="text-[12px] tracking-wide">讀下一段 / 下一句</span>';
        btnPlay.classList.remove('loading-pulse');
      };

      window.speechSynthesis.speak(utterance);
    }

    btnNext.addEventListener('click', () => {
      const fullText = recognizedText.value.trim();
      if (!fullText) return alert('請先拍照或在文字框輸入文字！');

      if (fullText !== lastText) {
        currentSentences = splitTextIntoChunks(fullText);
        lastText = fullText;
        currentIndex = 0;
      }

      if (currentIndex >= currentSentences.length) {
        alert("🎉 已經讀完最後一句！將重新由頭開始。");
        currentIndex = 0;
      }

      const chunkToSpeak = currentSentences[currentIndex];
      const startPos = fullText.indexOf(chunkToSpeak, Math.max(0, fullText.indexOf(currentSentences[currentIndex-1] || "")));
      if (startPos !== -1) {
        recognizedText.focus();
        recognizedText.setSelectionRange(startPos, startPos + chunkToSpeak.length);
      }

      sentenceProgress.classList.remove('hidden');
      sentenceProgress.innerText = `第 ${currentIndex + 1} / ${currentSentences.length} 句`;

      speakText(chunkToSpeak, true);
      currentIndex++;
    });

    btnPlay.addEventListener('click', () => {
      const text = recognizedText.value.trim();
      if (!text) return alert('請先拍照或輸入文字！');
      resetProgress();
      speakText(text, false);
    });

    btnStop.addEventListener('click', () => {
      window.speechSynthesis.cancel();
      btnNext.classList.remove('loading-pulse');
      btnNext.innerHTML = '<i class="fa-solid fa-forward-step text-lg"></i><span class="text-[12px] tracking-wide">讀下一段 / 下一句</span>';
      btnPlay.classList.remove('loading-pulse');
      resetProgress();
    });
  </script>
</body>
</html>
