<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智能默書掃描助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 離線備用 OCR 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .loading-pulse { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .active-row {
      background-color: #e0e7ff !important;
      border-color: #6366f1 !important;
      font-weight: 700;
      color: #312e81;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

  <!-- 頂部導航欄 -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-pen-clip text-xl"></i>
        <h1 class="text-base font-bold">智能默書掃描助手</h1>
      </div>
      <div class="flex items-center space-x-2">
        <button id="btnOpenFiles" class="text-xs bg-indigo-500 hover:bg-indigo-400 active:opacity-80 px-2.5 py-1.5 rounded-lg flex items-center space-x-1 font-medium transition">
          <i class="fa-solid fa-folder-open"></i>
          <span>篇章存檔</span>
        </button>
        <button id="btnOpenSettings" class="text-xs bg-indigo-500 hover:bg-indigo-400 active:opacity-80 px-2.5 py-1.5 rounded-lg flex items-center space-x-1 font-medium transition">
          <i class="fa-solid fa-key"></i>
          <span>API Key</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-3 space-y-3">

    <!-- 狀態標籤欄 -->
    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between text-xs">
      <div class="flex items-center space-x-2">
        <span class="font-semibold text-slate-600">辨識狀態：</span>
        <span id="engineBadge" class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-medium">預設通道</span>
      </div>
      <button id="btnQuickConfig" class="text-indigo-600 font-bold hover:underline">設定 / 測試 Key</button>
    </div>

    <!-- 步驟 1: 拍照與相簿選取 -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5">
        1. 獲取相片 (拍照或相簿)
      </h2>

      <div class="grid grid-cols-2 gap-3 mb-2">
        <label for="cameraInput" class="cursor-pointer flex items-center justify-center space-x-2 p-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl border border-indigo-200 select-none">
          <i class="fa-solid fa-camera text-lg"></i>
          <span class="text-xs font-semibold">即時拍照</span>
        </label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">

        <label for="galleryInput" class="cursor-pointer flex items-center justify-center space-x-2 p-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl border border-emerald-200 select-none">
          <i class="fa-solid fa-images text-lg"></i>
          <span class="text-xs font-semibold">相簿選取</span>
        </label>
        <input type="file" id="galleryInput" accept="image/*" style="display:none;">
      </div>

      <!-- 圖片預覽區域 -->
      <div id="previewContainer" class="hidden mt-2">
        <div class="relative rounded-xl overflow-hidden bg-slate-900 border border-slate-200 max-h-48 flex items-center justify-center">
          <img id="imagePreview" src="" alt="預覽圖片" class="max-h-48 w-full object-contain">
          <button id="btnRemoveImage" class="absolute top-2 right-2 bg-black/60 text-white rounded-full p-2 text-xs hover:bg-black/80">
            <i class="fa-solid fa-times"></i>
          </button>
        </div>
      </div>

      <!-- 進度指示條 -->
      <div id="ocrProgressBox" class="hidden mt-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
        <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
          <span id="ocrStatusText">準備掃描...</span>
          <span id="ocrPercentText">處理中</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
          <div id="ocrProgressBar" class="bg-indigo-600 h-1.5 rounded-full transition-all duration-300" style="width: 30%"></div>
        </div>
      </div>
    </div>

    <!-- 步驟 2: 識別文字內容 -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">
          2. 默書內容清單
        </h2>
        
        <div class="flex items-center space-x-2 text-xs">
          <!-- 盲測按鈕 -->
          <button id="btnToggleBlind" class="px-2 py-1 rounded-lg bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 font-semibold flex items-center space-x-1 transition">
            <i class="fa-solid fa-eye" id="blindIcon"></i>
            <span id="blindText">遮蔽</span>
          </button>

          <!-- 編輯 / 貼上 -->
          <button id="btnToggleEdit" class="px-2 py-1 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 font-semibold flex items-center space-x-1 transition">
            <i class="fa-solid fa-pen"></i>
            <span id="editBtnText">編輯/貼上</span>
          </button>

          <!-- 存檔 -->
          <button id="btnSaveCurrent" class="px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 font-semibold flex items-center space-x-1 transition">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>存檔</span>
          </button>

          <button id="btnClearText" class="text-rose-500 hover:text-rose-700 font-medium ml-1">清空</button>
        </div>
      </div>
      
      <!-- 條列式分句閱讀板 -->
      <div id="textDisplayBox" class="min-h-[160px] max-h-64 overflow-y-auto p-2 bg-slate-50 border border-slate-200 rounded-xl text-sm leading-relaxed text-slate-800 space-y-1.5 select-none scroll-smooth">
        <div class="text-slate-400 p-2 text-center text-xs">請拍照、上傳圖片或點「編輯/貼上」直接填入課文...</div>
      </div>

      <textarea id="recognizedText" rows="6" class="hidden w-full p-3 bg-white border-2 border-indigo-500 rounded-xl text-sm leading-relaxed focus:outline-none transition mt-2" placeholder="在此直接輸入、貼上或修正課文文字..."></textarea>
    </div>

    <!-- 步驟 3: 默書控制與發音設定 -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">
          3. 發音與默書控制
        </h2>
        <span id="sentenceProgress" class="text-[11px] bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full font-bold hidden">第 0 / 0 句</span>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label for="voiceSelect" class="block text-[11px] font-semibold text-slate-600 mb-1">語言 / 英語口音：</label>
          <select id="voiceSelect" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500">
            <option value="">載入系統語音中...</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">語速：</label>
          <div class="grid grid-cols-3 gap-1">
            <button type="button" data-speed="0.75" class="speed-btn py-1.5 rounded-lg border border-slate-200 text-[11px] font-semibold text-slate-600 hover:bg-slate-50">慢</button>
            <button type="button" data-speed="1.0" class="speed-btn py-1.5 rounded-lg border border-indigo-600 bg-indigo-50 text-[11px] font-semibold text-indigo-700">中</button>
            <button type="button" data-speed="1.3" class="speed-btn py-1.5 rounded-lg border border-slate-200 text-[11px] font-semibold text-slate-600 hover:bg-slate-50">快</button>
          </div>
        </div>
      </div>

      <div class="bg-indigo-50/70 border border-indigo-100 p-2.5 rounded-xl flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <input type="checkbox" id="chkReadPunc" class="w-4 h-4 text-indigo-600 rounded border-slate-300 bg-white" checked>
          <label for="chkReadPunc" class="text-xs font-bold text-indigo-900">📝 默書模式 (讀出所有中英文標點符號)</label>
        </div>
        <span class="text-[10px] text-indigo-500 font-medium">全標點朗讀已開啟</span>
      </div>

      <!-- 控制按鈕 -->
      <div class="grid grid-cols-5 gap-2 pt-1">
        <button id="btnPrev" class="col-span-1 bg-slate-100 hover:bg-slate-200 active:opacity-80 text-slate-700 font-bold py-3 rounded-xl transition flex flex-col items-center justify-center">
          <i class="fa-solid fa-backward-step text-base"></i>
          <span class="text-[10px] mt-0.5">上一句</span>
        </button>

        <button id="btnReplay" class="col-span-1 bg-slate-100 hover:bg-slate-200 active:opacity-80 text-slate-700 font-bold py-3 rounded-xl transition flex flex-col items-center justify-center">
          <i class="fa-solid fa-rotate-right text-base"></i>
          <span class="text-[10px] mt-0.5">重聽</span>
        </button>

        <button id="btnNext" class="col-span-3 bg-indigo-600 hover:bg-indigo-700 active:opacity-80 text-white font-bold py-3 rounded-xl shadow-md shadow-indigo-200 transition flex items-center justify-center space-x-2">
          <i class="fa-solid fa-forward-step text-lg"></i>
          <span class="text-sm tracking-wide">下一句</span>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2 mt-2">
        <button id="btnPlayAll" class="bg-slate-100 hover:bg-slate-200 active:opacity-80 text-slate-600 font-semibold py-2 rounded-xl text-xs flex items-center justify-center space-x-1">
          <i class="fa-solid fa-play text-[10px]"></i>
          <span>全部朗讀</span>
        </button>
        <button id="btnStop" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold py-2 rounded-xl text-xs flex items-center justify-center space-x-1">
          <i class="fa-solid fa-stop text-[10px]"></i>
          <span>停止 / 重設</span>
        </button>
      </div>
    </div>

  </main>

  <!-- 篇章存檔管理 Modal -->
  <div id="filesModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl max-h-[85vh] flex flex-col space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-folder-open text-indigo-600 text-lg"></i>
          <h3 class="text-sm font-bold text-slate-800">已儲存的默書篇章</h3>
        </div>
        <button id="btnCloseFiles" class="text-slate-400 hover:text-slate-600 text-lg p-1"><i class="fa-solid fa-times"></i></button>
      </div>
      <div id="savedFilesList" class="flex-1 overflow-y-auto space-y-2 pr-1 min-h-[200px]"></div>
    </div>
  </div>

  <!-- API 設定 Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-sm font-bold text-slate-800">OCR.Space API Key 設定</h3>
        <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-times"></i></button>
      </div>
      
      <div class="space-y-3">
        <p class="text-xs text-slate-600 leading-relaxed">
          公共通道多人共用時容易超額。強烈建議花 10 秒免費申請專屬 Key（每月免費 25,000 次）：
        </p>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">你的專屬 API Key：</label>
          <input type="text" id="inputApiKey" placeholder="輸入 API Key (如 K8xxxxxx)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none font-mono">
          <p class="text-[11px] text-slate-400 mt-1">
            免費領取網址：<a href="https://ocr.space/ocrapi/freekey" target="_blank" class="text-indigo-600 underline font-semibold">ocr.space/ocrapi/freekey</a> (填 Email 即刻收到)
          </p>
        </div>

        <div id="testKeyFeedback" class="text-xs font-semibold hidden p-2 rounded-lg"></div>
      </div>

      <div class="flex space-x-2 pt-1">
        <button id="btnTestKey" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition">測試連線</button>
        <button id="btnSaveKey" class="w-2/3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition">儲存並使用</button>
      </div>
    </div>
  </div>

  <canvas id="compressCanvas" class="hidden"></canvas>

  <script>
    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const btnRemoveImage = document.getElementById('btnRemoveImage');
    
    const ocrProgressBox = document.getElementById('ocrProgressBox');
    const ocrStatusText = document.getElementById('ocrStatusText');
    const ocrPercentText = document.getElementById('ocrPercentText');
    const ocrProgressBar = document.getElementById('ocrProgressBar');
    
    const textDisplayBox = document.getElementById('textDisplayBox');
    const recognizedText = document.getElementById('recognizedText');
    const btnToggleEdit = document.getElementById('btnToggleEdit');
    const editBtnText = document.getElementById('editBtnText');
    const btnToggleBlind = document.getElementById('btnToggleBlind');
    const blindIcon = document.getElementById('blindIcon');
    const blindText = document.getElementById('blindText');
    const btnSaveCurrent = document.getElementById('btnSaveCurrent');
    const btnClearText = document.getElementById('btnClearText');

    const voiceSelect = document.getElementById('voiceSelect');
    const speedButtons = document.querySelectorAll('.speed-btn');
    const btnPrev = document.getElementById('btnPrev');
    const btnReplay = document.getElementById('btnReplay');
    const btnNext = document.getElementById('btnNext');
    const btnPlayAll = document.getElementById('btnPlayAll');
    const btnStop = document.getElementById('btnStop');
    const chkReadPunc = document.getElementById('chkReadPunc');
    const sentenceProgress = document.getElementById('sentenceProgress');
    const compressCanvas = document.getElementById('compressCanvas');

    const btnOpenFiles = document.getElementById('btnOpenFiles');
    const filesModal = document.getElementById('filesModal');
    const btnCloseFiles = document.getElementById('btnCloseFiles');
    const savedFilesList = document.getElementById('savedFilesList');

    const engineBadge = document.getElementById('engineBadge');
    const btnOpenSettings = document.getElementById('btnOpenSettings');
    const btnQuickConfig = document.getElementById('btnQuickConfig');
    const settingsModal = document.getElementById('settingsModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnSaveKey = document.getElementById('btnSaveKey');
    const btnTestKey = document.getElementById('btnTestKey');
    const inputApiKey = document.getElementById('inputApiKey');
    const testKeyFeedback = document.getElementById('testKeyFeedback');

    let currentRate = 1.0;
    let availableVoices = [];
    const DEFAULT_KEY = 'K87899142388957';
    let userApiKey = localStorage.getItem('ocrspace_user_key') || '';
    
    let isEditing = false;
    let isBlindMode = false;
    let rawFullText = "";
    let currentSentences = [];
    let currentIndex = 0;

    function refreshBadge() {
      if (userApiKey) {
        engineBadge.className = 'bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold';
        engineBadge.innerText = '專屬 API Key';
      } else {
        engineBadge.className = 'bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-medium';
        engineBadge.innerText = '預設通道';
      }
    }
    refreshBadge();

    cameraInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) handleImage(e.target.files[0]);
    });
    galleryInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) handleImage(e.target.files[0]);
    });

    const openSettings = () => {
      inputApiKey.value = userApiKey;
      testKeyFeedback.className = 'hidden';
      settingsModal.classList.remove('hidden');
    };
    btnOpenSettings.addEventListener('click', openSettings);
    btnQuickConfig.addEventListener('click', openSettings);
    btnCloseModal.addEventListener('click', () => settingsModal.classList.add('hidden'));

    btnSaveKey.addEventListener('click', () => {
      userApiKey = inputApiKey.value.trim();
      if (userApiKey) localStorage.setItem('ocrspace_user_key', userApiKey);
      else localStorage.removeItem('ocrspace_user_key');
      refreshBadge();
      settingsModal.classList.add('hidden');
    });

    btnTestKey.addEventListener('click', async () => {
      const keyToTest = inputApiKey.value.trim() || DEFAULT_KEY;
      testKeyFeedback.className = 'text-xs font-semibold p-2 rounded-lg bg-blue-50 text-blue-700 block';
      testKeyFeedback.innerText = '正在測試連線中...';

      try {
        const tCanvas = document.createElement('canvas');
        tCanvas.width = 60;
        tCanvas.height = 30;
        const ctx = tCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 60, 30);
        ctx.fillStyle = '#000000';
        ctx.font = '16px sans-serif';
        ctx.fillText('TEST', 5, 20);
        const testBase64 = tCanvas.toDataURL('image/jpeg', 0.8);

        const fd = new FormData();
        fd.append('apikey', keyToTest);
        fd.append('base64Image', testBase64);
        fd.append('language', 'eng');

        const res = await fetch('https://api.ocr.space/parse/image', {
          method: 'POST',
          body: fd
        });
        const d = await res.json();
        if (d.OCRExitCode === 1 || d.OCRExitCode === 2) {
          testKeyFeedback.className = 'text-xs font-semibold p-2 rounded-lg bg-emerald-50 text-emerald-700 block';
          testKeyFeedback.innerText = '✅ 連線成功！此 API Key 運作完全正常。';
        } else {
          testKeyFeedback.className = 'text-xs font-semibold p-2 rounded-lg bg-rose-50 text-rose-700 block';
          testKeyFeedback.innerText = '❌ 驗證失敗：' + (d.ErrorMessage ? d.ErrorMessage.join(', ') : '通道繁忙或無效');
        }
      } catch (err) {
        testKeyFeedback.className = 'text-xs font-semibold p-2 rounded-lg bg-rose-50 text-rose-700 block';
        testKeyFeedback.innerText = '❌ 連線錯誤：' + err.message;
      }
    });

    btnToggleBlind.addEventListener('click', () => {
      isBlindMode = !isBlindMode;
      if (isBlindMode) {
        blindIcon.className = 'fa-solid fa-eye-slash';
        blindText.innerText = '顯示';
        btnToggleBlind.className = 'px-2 py-1 rounded-lg bg-indigo-600 text-white font-semibold flex items-center space-x-1 transition';
      } else {
        blindIcon.className = 'fa-solid fa-eye';
        blindText.innerText = '遮蔽';
        btnToggleBlind.className = 'px-2 py-1 rounded-lg bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 font-semibold flex items-center space-x-1 transition';
      }
      renderDisplayBoard(currentIndex);
    });

    btnToggleEdit.addEventListener('click', () => {
      isEditing = !isEditing;
      if (isEditing) {
        recognizedText.value = rawFullText;
        recognizedText.classList.remove('hidden');
        textDisplayBox.classList.add('hidden');
        editBtnText.innerText = '完成';
        btnToggleEdit.classList.add('text-emerald-600');
        recognizedText.focus();
      } else {
        rawFullText = recognizedText.value;
        recognizedText.classList.add('hidden');
        textDisplayBox.classList.remove('hidden');
        editBtnText.innerText = '編輯/貼上';
        btnToggleEdit.classList.remove('text-emerald-600');
        resetProgress();
        renderDisplayBoard(0);
      }
    });

    // 智能分句：將主要標點作為分段依據，並完整保留句尾所有附屬標點（如引號、括號等）
    function splitTextIntoChunks(text) {
      if (!text) return [];
      const regex = /[^，,。\.！!？\?；;：:\n、…—]+[，,。\.！!？\?；;：:\n、…—]*[”"』」）\)》〉\]]*/g;
      const arr = text.match(regex);
      if (!arr) return [text.trim()];
      return arr.map(s => s.trim()).filter(s => s.length > 0);
    }

    // 盲測時保留標點符號，僅將中英文字詞轉為星號
    function maskText(str) {
      return str.replace(/[\u4e00-\u9fa5a-zA-Z0-9]/g, '*');
    }

    // ========== 全標點符號語音字典核心 ========== //
    function processDictationPunctuation(text, voiceLang) {
      const isEnglish = voiceLang.startsWith('en');

      if (isEnglish) {
        let res = text;
        // 1. 省略號、破折號與字內撇號 (如 don't, it's)
        res = res.replace(/(\.{3,}|…+|……+)/g, ' ellipsis. ');
        res = res.replace(/(——+|—+)/g, ' dash, ');
        res = res.replace(/([a-zA-Z])['’]([a-zA-Z])/g, '$1 apostrophe $2');

        // 2. 成對標點 (雙引號、單引號、括號、書名號)
        res = res.replace(/[“『]/g, ' open quote, ');
        res = res.replace(/[”』]/g, ' close quote, ');
        res = res.replace(/[‘「]/g, ' open single quote, ');
        res = res.replace(/[’」]/g, ' close single quote, ');
        res = res.replace(/[《〈]/g, ' open angle bracket, ');
        res = res.replace(/[》〉]/g, ' close angle bracket, ');
        res = res.replace(/[（(]/g, ' open bracket, ');
        res = res.replace(/[）)]/g, ' close bracket, ');
        res = res.replace(/[［\[]/g, ' open square bracket, ');
        res = res.replace(/[］\]]/g, ' close square bracket, ');

        // 3. 中立引號交替處理
        let openD = true;
        res = res.replace(/"/g, () => {
          const str = openD ? ' open quote, ' : ' close quote, ';
          openD = !openD;
          return str;
        });
        let openS = true;
        res = res.replace(/'/g, () => {
          const str = openS ? ' open single quote, ' : ' close single quote, ';
          openS = !openS;
          return str;
        });

        // 4. 標準英文標點符號
        res = res.replace(/[，,、]/g, ' comma, ');
        res = res.replace(/[。.]/g, ' full stop. ');
        res = res.replace(/[？?]/g, ' question mark? ');
        res = res.replace(/[！!]/g, ' exclamation mark! ');
        res = res.replace(/[：:]/g, ' colon: ');
        res = res.replace(/[；;]/g, ' semicolon; ');
        res = res.replace(/[-]/g, ' hyphen ');
        res = res.replace(/[/／]/g, ' slash ');
        res = res.replace(/[~～]/g, ' tilde ');
        res = res.replace(/\n/g, ' new line. ');

        return res;
      } else {
        // 廣東話 / 中文全標點
        let res = text;
        // 1. 省略號與破折號
        res = res.replace(/(\.{3,}|…+|……+)/g, ' 省略號， ');
        res = res.replace(/(——+|—+)/g, ' 破折號， ');

        // 2. 書名號、引號與各類括號
        res = res.replace(/[《]/g, ' 開書名號， ');
        res = res.replace(/[》]/g, ' 關書名號， ');
        res = res.replace(/[〈]/g, ' 開單書名號， ');
        res = res.replace(/[〉]/g, ' 關單書名號， ');
        res = res.replace(/[“『]/g, ' 開引號， ');
        res = res.replace(/[”』]/g, ' 關引號， ');
        res = res.replace(/[‘「]/g, ' 開單引號， ');
        res = res.replace(/[’」]/g, ' 關單引號， ');
        res = res.replace(/[（(]/g, ' 開括號， ');
        res = res.replace(/[）)]/g, ' 關括號， ');
        res = res.replace(/[［\[]/g, ' 開方括號， ');
        res = res.replace(/[］\]]/g, ' 關方括號， ');

        // 3. 中立引號交替處理
        let openD = true;
        res = res.replace(/"/g, () => {
          const str = openD ? ' 開引號， ' : ' 關引號， ';
          openD = !openD;
          return str;
        });
        let openS = true;
        res = res.replace(/'/g, () => {
          const str = openS ? ' 開單引號， ' : ' 關單引號， ';
          openS = !openS;
          return str;
        });

        // 4. 標準中文標點符號
        res = res.replace(/[。.]/g, ' 句號。 ');
        res = res.replace(/[，,]/g, ' 逗號， ');
        res = res.replace(/、/g, ' 頓號， ');
        res = res.replace(/[？?]/g, ' 問號？ ');
        res = res.replace(/[！!]/g, ' 感嘆號！ ');
        res = res.replace(/[：:]/g, ' 冒號： ');
        res = res.replace(/[；;]/g, ' 分號； ');
        res = res.replace(/[-–]/g, ' 連接號， ');
        res = res.replace(/[/／]/g, ' 斜線， ');
        res = res.replace(/[~～]/g, ' 波浪號， ');
        res = res.replace(/\n/g, ' 開新行。 ');

        return res;
      }
    }

    function renderDisplayBoard(activeIdx) {
      if (!rawFullText) {
        textDisplayBox.innerHTML = '<div class="text-slate-400 p-2 text-center text-xs">請拍照、上傳圖片或點「編輯/貼上」直接填入課文...</div>';
        return;
      }

      currentSentences = splitTextIntoChunks(rawFullText);
      textDisplayBox.innerHTML = '';

      let activeRowElement = null;

      currentSentences.forEach((chunk, idx) => {
        const row = document.createElement('div');
        row.className = `p-2 rounded-lg border border-slate-200/80 bg-white flex items-start space-x-2 cursor-pointer transition ${idx === activeIdx ? 'active-row shadow-sm' : 'hover:bg-slate-100/60'}`;
        
        row.addEventListener('click', (e) => {
          e.preventDefault();
          currentIndex = idx;
          renderDisplayBoard(currentIndex);
          updateProgressUI();
          speakText(currentSentences[currentIndex]);
        });

        const numSpan = document.createElement('span');
        numSpan.className = 'text-xs font-bold text-slate-400 mt-0.5 select-none min-w-[20px]';
        numSpan.innerText = `${idx + 1}.`;

        const contentSpan = document.createElement('span');
        contentSpan.className = 'text-xs font-medium leading-relaxed flex-1';
        contentSpan.innerText = isBlindMode ? maskText(chunk) : chunk;

        row.appendChild(numSpan);
        row.appendChild(contentSpan);
        textDisplayBox.appendChild(row);

        if (idx === activeIdx) activeRowElement = row;
      });

      if (activeRowElement) {
        const parentTop = textDisplayBox.offsetTop;
        const elemTop = activeRowElement.offsetTop;
        const relativeTop = elemTop - parentTop;
        const targetScroll = relativeTop - (textDisplayBox.clientHeight / 2) + (activeRowElement.clientHeight / 2);
        textDisplayBox.scrollTo({ top: Math.max(0, targetScroll), behavior: 'smooth' });
      }
    }

    function updateProgressUI() {
      if (currentSentences.length > 0) {
        sentenceProgress.classList.remove('hidden');
        sentenceProgress.innerText = `第 ${currentIndex + 1} / ${currentSentences.length} 句`;
      } else {
        sentenceProgress.classList.add('hidden');
      }
    }

    function resetProgress() {
      currentIndex = 0;
      updateProgressUI();
    }

    btnSaveCurrent.addEventListener('click', () => {
      if (isEditing) btnToggleEdit.click();
      if (!rawFullText.trim()) return alert('目前沒有文字可以儲存！');

      const defaultName = rawFullText.trim().substring(0, 15).replace(/\n/g, ' ') + '...';
      const fileName = prompt('請輸入篇章名稱：', defaultName);
      if (!fileName) return;

      const saved = JSON.parse(localStorage.getItem('dictation_saved_files') || '[]');
      saved.unshift({
        id: Date.now(),
        title: fileName,
        content: rawFullText,
        date: new Date().toLocaleDateString()
      });
      localStorage.setItem('dictation_saved_files', JSON.stringify(saved));
      alert(`✅ 已儲存：「${fileName}」！`);
    });

    btnOpenFiles.addEventListener('click', () => {
      renderSavedList();
      filesModal.classList.remove('hidden');
    });
    btnCloseFiles.addEventListener('click', () => filesModal.classList.add('hidden'));

    function renderSavedList() {
      const saved = JSON.parse(localStorage.getItem('dictation_saved_files') || '[]');
      savedFilesList.innerHTML = '';

      if (saved.length === 0) {
        savedFilesList.innerHTML = '<div class="text-slate-400 text-center py-8 text-xs">暫無已存檔的篇章。可在掃描後點「存檔」儲存。</div>';
        return;
      }

      saved.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between space-x-2';
        card.innerHTML = `
          <div class="flex-1 min-w-0">
            <h4 class="text-xs font-bold text-slate-800 truncate">${item.title}</h4>
            <p class="text-[10px] text-slate-400 mt-0.5 truncate">${item.date} • ${item.content.substring(0, 30)}...</p>
          </div>
          <div class="flex items-center space-x-2 shrink-0">
            <button class="btn-load px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 active:opacity-80 text-white rounded-lg text-xs font-semibold">載入</button>
            <button class="btn-del p-1.5 text-rose-500 hover:bg-rose-50 active:opacity-80 rounded-lg text-xs"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;

        card.querySelector('.btn-load').addEventListener('click', () => {
          rawFullText = item.content;
          recognizedText.value = rawFullText;
          resetProgress();
          renderDisplayBoard(0);
          updateProgressUI();
          filesModal.classList.add('hidden');
        });

        card.querySelector('.btn-del').addEventListener('click', () => {
          if (confirm(`確定要刪除「${item.title}」嗎？`)) {
            const updated = saved.filter(f => f.id !== item.id);
            localStorage.setItem('dictation_saved_files', JSON.stringify(updated));
            renderSavedList();
          }
        });

        savedFilesList.appendChild(card);
      });
    }

    btnRemoveImage.addEventListener('click', () => {
      previewContainer.classList.add('hidden');
      imagePreview.src = '';
      cameraInput.value = '';
      galleryInput.value = '';
    });

    btnClearText.addEventListener('click', () => {
      rawFullText = '';
      recognizedText.value = '';
      resetProgress();
      renderDisplayBoard(-1);
    });

    function compressImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 900;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          compressCanvas.width = w;
          compressCanvas.height = h;
          const ctx = compressCanvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(compressCanvas.toDataURL('image/jpeg', 0.7));
        };
        const reader = new FileReader();
        reader.onload = (e) => img.src = e.target.result;
        reader.readAsDataURL(file);
      });
    }

    async function handleImage(file) {
      if (!file) return;
      const base64DataUrl = await compressImage(file);
      imagePreview.src = base64DataUrl;
      previewContainer.classList.remove('hidden');

      ocrProgressBox.classList.remove('hidden');
      ocrProgressBar.style.width = '35%';
      ocrStatusText.innerText = '正在上傳雲端分析...';
      ocrPercentText.innerText = '處理中';
      resetProgress();

      const activeKey = userApiKey || DEFAULT_KEY;

      try {
        const formData = new FormData();
        formData.append('apikey', activeKey);
        formData.append('base64Image', base64DataUrl);
        formData.append('language', 'cht');
        formData.append('isOverlayRequired', 'false');
        formData.append('detectOrientation', 'true');
        formData.append('scale', 'true');

        const response = await fetch('https://api.ocr.space/parse/image', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.ParsedResults && data.ParsedResults.length > 0) {
          rawFullText = data.ParsedResults[0].ParsedText.trim();
          recognizedText.value = rawFullText;
          renderDisplayBoard(0);
          updateProgressUI();
          ocrProgressBar.style.width = '100%';
          ocrStatusText.innerText = '掃描完成！';
          ocrPercentText.innerText = '100%';
        } else {
          const errDetail = data.ErrorMessage ? data.ErrorMessage.join(', ') : '解析為空';
          throw new Error(errDetail);
        }
      } catch (err) {
        console.warn('雲端掃描異常，自動啟動本地備用引擎:', err);
        ocrStatusText.innerText = '雲端繁忙，切換本地引擎掃描中...';
        try {
          const worker = await Tesseract.createWorker('chi_tra+eng', 1);
          const ret = await worker.recognize(base64DataUrl);
          await worker.terminate();
          rawFullText = ret.data.text.trim();
          recognizedText.value = rawFullText;
          renderDisplayBoard(0);
          updateProgressUI();
          ocrStatusText.innerText = '本地掃描完成！';
          ocrPercentText.innerText = '100%';
        } catch (e) {
          alert('掃描發生問題：' + err.message + '\n你可點「編輯/貼上」直接填入課文，或在右上角設定專屬免費 Key。');
        }
      }
      setTimeout(() => ocrProgressBox.classList.add('hidden'), 1200);
    }

    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
      if (!availableVoices.length) return;

      voiceSelect.innerHTML = '';
      const cantoneseVoices = [];
      const englishVoices = [];

      availableVoices.forEach(v => {
        const lang = v.lang.replace('_', '-');
        const name = v.name.toLowerCase();
        if (lang === 'zh-HK' || lang === 'yue' || lang === 'zh-yue' || name.includes('cantonese') || name.includes('hong kong') || name.includes('香港')) {
          cantoneseVoices.push(v);
        } else if (lang.startsWith('en')) {
          englishVoices.push(v);
        }
      });

      const cantoneseGroup = document.createElement('optgroup');
      cantoneseGroup.label = '🇭🇰 粵語 (Cantonese)';
      cantoneseVoices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name; opt.textContent = `粵語 - ${v.name}`;
        cantoneseGroup.appendChild(opt);
      });
      if (!cantoneseVoices.length) cantoneseGroup.innerHTML = '<option value="">無專屬粵語 (預設中文)</option>';
      voiceSelect.appendChild(cantoneseGroup);

      const englishGroup = document.createElement('optgroup');
      englishGroup.label = '🌐 英語口音 (English)';
      englishVoices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        let label = '英語';
        const lang = v.lang.replace('_', '-');
        if (lang === 'en-US') label = '🇺🇸 美國';
        else if (lang === 'en-GB') label = '🇬🇧 英國';
        else if (lang === 'en-AU') label = '🇦🇺 澳洲';
        else if (lang === 'en-CA') label = '🇨🇦 加拿大';
        else if (lang === 'en-IN') label = '🇮🇳 印度';
        opt.textContent = `${label} - ${v.name}`;
        englishGroup.appendChild(opt);
      });
      voiceSelect.appendChild(englishGroup);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    speedButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        speedButtons.forEach(b => b.className = 'speed-btn py-1.5 rounded-lg border border-slate-200 text-[11px] font-semibold text-slate-600 hover:bg-slate-50');
        btn.className = 'speed-btn py-1.5 rounded-lg border border-indigo-600 bg-indigo-50 text-[11px] font-semibold text-indigo-700';
        currentRate = parseFloat(btn.dataset.speed);
      });
    });

    function speakText(textToRead) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.rate = currentRate;

      const selectedVoiceName = voiceSelect.value;
      let voiceLang = 'zh-HK'; 
      if (selectedVoiceName) {
        const found = availableVoices.find(v => v.name === selectedVoiceName);
        if (found) {
          utterance.voice = found;
          voiceLang = found.lang;
        }
      }

      if (chkReadPunc.checked) {
        utterance.text = processDictationPunctuation(textToRead, voiceLang);
      }

      btnNext.classList.add('loading-pulse');
      utterance.onend = utterance.onerror = () => {
        btnNext.classList.remove('loading-pulse');
      };

      window.speechSynthesis.speak(utterance);
    }

    btnNext.addEventListener('click', (e) => {
      e.preventDefault();
      if (isEditing) btnToggleEdit.click();
      if (!rawFullText) return alert('請先拍照或輸入文字！');
      if (!currentSentences.length) currentSentences = splitTextIntoChunks(rawFullText);

      if (currentIndex >= currentSentences.length - 1) {
        alert("🎉 已經讀到最後一句了！將從頭開始。");
        currentIndex = 0;
      } else {
        currentIndex++;
      }

      renderDisplayBoard(currentIndex);
      updateProgressUI();
      speakText(currentSentences[currentIndex]);
    });

    btnPrev.addEventListener('click', (e) => {
      e.preventDefault();
      if (isEditing) btnToggleEdit.click();
      if (!rawFullText) return alert('請先拍照或輸入文字！');
      if (!currentSentences.length) currentSentences = splitTextIntoChunks(rawFullText);

      if (currentIndex > 0) {
        currentIndex--;
      } else {
        alert("這已經是第一句了！");
      }

      renderDisplayBoard(currentIndex);
      updateProgressUI();
      speakText(currentSentences[currentIndex]);
    });

    btnReplay.addEventListener('click', (e) => {
      e.preventDefault();
      if (!currentSentences.length) return;
      renderDisplayBoard(currentIndex);
      speakText(currentSentences[currentIndex]);
    });

    btnPlayAll.addEventListener('click', (e) => {
      e.preventDefault();
      if (isEditing) btnToggleEdit.click();
      if (!rawFullText) return alert('請先拍照或輸入文字！');
      resetProgress();
      renderDisplayBoard(-1);
      speakText(rawFullText);
    });

    btnStop.addEventListener('click', (e) => {
      e.preventDefault();
      window.speechSynthesis.cancel();
      btnNext.classList.remove('loading-pulse');
      resetProgress();
      renderDisplayBoard(-1);
    });
  </script>
</body>
