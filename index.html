<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>語音掃描助手 - 香港可用 OCR 朗讀</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .loading-pulse { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-camera-retro text-2xl"></i>
        <h1 class="text-lg font-bold">語音掃描助手</h1>
      </div>
      <button id="btnOpenSettings" class="text-xs bg-indigo-500 hover:bg-indigo-400 px-2.5 py-1.5 rounded-lg flex items-center space-x-1 transition">
        <i class="fa-solid fa-key"></i>
        <span>設定 API Key</span>
      </button>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-4 space-y-4">

    <!-- 狀態標籤 -->
    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between text-xs">
      <div class="flex items-center space-x-2">
        <span class="font-semibold text-slate-600">辨識狀態：</span>
        <span id="apiKeyStatus" class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-medium">使用預設公共通道</span>
      </div>
      <button id="btnSwitchEngine" class="text-indigo-600 font-bold hover:underline">自訂專屬 Key</button>
    </div>

    <!-- 步驟 1: 拍照 / 上傳圖片 -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">
        1. 獲取相片 (拍照或相簿)
      </h2>

      <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
      <input type="file" id="galleryInput" accept="image/*" class="hidden">

      <div class="grid grid-cols-2 gap-3 mb-3">
        <button id="btnCamera" class="flex flex-col items-center justify-center p-4 bg-indigo-50 hover:bg-indigo-100 active:scale-95 text-indigo-700 rounded-xl border border-indigo-200 transition">
          <i class="fa-solid fa-camera text-2xl mb-1"></i>
          <span class="text-sm font-semibold">即時拍照</span>
        </button>
        <button id="btnGallery" class="flex flex-col items-center justify-center p-4 bg-emerald-50 hover:bg-emerald-100 active:scale-95 text-emerald-700 rounded-xl border border-emerald-200 transition">
          <i class="fa-solid fa-images text-2xl mb-1"></i>
          <span class="text-sm font-semibold">從相簿選取</span>
        </button>
      </div>

      <!-- 預覽區域 -->
      <div id="previewContainer" class="hidden">
        <div class="relative rounded-xl overflow-hidden bg-slate-900 border border-slate-200 max-h-60 flex items-center justify-center">
          <img id="imagePreview" src="" alt="預覽圖片" class="max-h-60 w-full object-contain">
          <button id="btnRemoveImage" class="absolute top-2 right-2 bg-black/60 text-white rounded-full p-2 text-xs hover:bg-black/80">
            <i class="fa-solid fa-times"></i>
          </button>
        </div>
      </div>

      <!-- 進度指示條 -->
      <div id="ocrProgressBox" class="hidden mt-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
        <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
          <span id="ocrStatusText">正在連線至雲端 OCR 引擎...</span>
          <span id="ocrPercentText">處理中</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
          <div id="ocrProgressBar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 40%"></div>
        </div>
      </div>
    </div>

    <!-- 步驟 2: 識別文字結果與編輯 -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider">
          2. 掃描文字內容
        </h2>
        <button id="btnClearText" class="text-xs text-rose-500 hover:text-rose-700 font-medium">
          清空
        </button>
      </div>
      
      <textarea id="recognizedText" rows="6" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" placeholder="掃描後的文字會自動填入此處，如有少許偏差可直接點擊此處手動修改..."></textarea>
    </div>

    <!-- 步驟 3: 朗讀口音與速度設定 -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
      <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider">
        3. 朗讀口音與速度
      </h2>

      <div>
        <label for="voiceSelect" class="block text-xs font-semibold text-slate-600 mb-1">選擇語言 / 英語口音：</label>
        <select id="voiceSelect" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">載入系統語音中...</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-2">朗讀速度：</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" data-speed="0.75" class="speed-btn py-2 px-3 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">
            🐢 慢速 (0.75x)
          </button>
          <button type="button" data-speed="1.0" class="speed-btn py-2 px-3 rounded-lg border border-indigo-600 bg-indigo-50 text-xs font-semibold text-indigo-700">
            🚶 中速 (正常)
          </button>
          <button type="button" data-speed="1.3" class="speed-btn py-2 px-3 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">
            🏃 快速 (1.3x)
          </button>
        </div>
      </div>

      <div class="pt-2 flex gap-3">
        <button id="btnPlay" class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-md shadow-indigo-200 flex items-center justify-center space-x-2 transition">
          <i class="fa-solid fa-volume-high"></i>
          <span>開始朗讀</span>
        </button>
        <button id="btnStop" class="bg-slate-200 hover:bg-slate-300 active:scale-95 text-slate-700 font-bold py-3.5 px-5 rounded-xl transition">
          <i class="fa-solid fa-stop"></i>
        </button>
      </div>
    </div>

  </main>

  <!-- Key 設定視窗 -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-base font-bold text-slate-800">OCR.Space API 設定</h3>
        <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-times"></i></button>
      </div>
      
      <div class="space-y-3">
        <p class="text-xs text-slate-600 leading-relaxed">
          OCR.space 伺服器在香港可直接存取（免翻牆）。
          免費版每月有 <strong>25,000 次</strong> 辨識額度。
        </p>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">OCR.Space API Key：</label>
          <input type="text" id="inputApiKey" placeholder="輸入 API Key 或使用預設" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <p class="text-[11px] text-slate-400 mt-1">
            可前往 <a href="https://ocr.space/ocrapi/freekey" target="_blank" class="text-indigo-600 underline font-semibold">ocr.space/ocrapi/freekey</a> 免費獲取個人專屬 Key（填寫 Email 即刻收到）。
          </p>
        </div>
      </div>

      <div class="flex space-x-2 pt-2">
        <button id="btnSaveKey" class="flex-1 bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-indigo-700">儲存設定</button>
      </div>
    </div>
  </div>

  <canvas id="compressCanvas" class="hidden"></canvas>

  <script>
    const btnCamera = document.getElementById('btnCamera');
    const btnGallery = document.getElementById('btnGallery');
    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const btnRemoveImage = document.getElementById('btnRemoveImage');
    
    const ocrProgressBox = document.getElementById('ocrProgressBox');
    const ocrStatusText = document.getElementById('ocrStatusText');
    const ocrPercentText = document.getElementById('ocrPercentText');
    const ocrProgressBar = document.getElementById('ocrProgressBar');
    
    const recognizedText = document.getElementById('recognizedText');
    const btnClearText = document.getElementById('btnClearText');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedButtons = document.querySelectorAll('.speed-btn');
    const btnPlay = document.getElementById('btnPlay');
    const btnStop = document.getElementById('btnStop');

    const apiKeyStatus = document.getElementById('apiKeyStatus');
    const btnOpenSettings = document.getElementById('btnOpenSettings');
    const btnSwitchEngine = document.getElementById('btnSwitchEngine');
    const settingsModal = document.getElementById('settingsModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnSaveKey = document.getElementById('btnSaveKey');
    const inputApiKey = document.getElementById('inputApiKey');
    const compressCanvas = document.getElementById('compressCanvas');

    let currentRate = 1.0;
    let availableVoices = [];
    
    // OCR.space 免費通用通道密鑰（留空或自訂皆可）
    let customApiKey = localStorage.getItem('ocrspace_api_key') || 'K87899142388957';

    function updateBadge() {
      if (localStorage.getItem('ocrspace_api_key')) {
        apiKeyStatus.className = 'bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold';
        apiKeyStatus.innerText = '使用專屬 API Key';
      } else {
        apiKeyStatus.className = 'bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-medium';
        apiKeyStatus.innerText = '使用預設公共通道';
      }
    }
    updateBadge();

    const openModal = () => { inputApiKey.value = localStorage.getItem('ocrspace_api_key') || ''; settingsModal.classList.remove('hidden'); };
    btnOpenSettings.addEventListener('click', openModal);
    btnSwitchEngine.addEventListener('click', openModal);
    btnCloseModal.addEventListener('click', () => settingsModal.classList.add('hidden'));
    
    btnSaveKey.addEventListener('click', () => {
      const val = inputApiKey.value.trim();
      if (val) {
        localStorage.setItem('ocrspace_api_key', val);
        customApiKey = val;
      } else {
        localStorage.removeItem('ocrspace_api_key');
        customApiKey = 'K87899142388957';
      }
      updateBadge();
      settingsModal.classList.add('hidden');
    });

    btnCamera.addEventListener('click', () => cameraInput.click());
    btnGallery.addEventListener('click', () => galleryInput.click());
    cameraInput.addEventListener('change', (e) => handleImage(e.target.files[0]));
    galleryInput.addEventListener('change', (e) => handleImage(e.target.files[0]));

    btnRemoveImage.addEventListener('click', () => {
      previewContainer.classList.add('hidden');
      imagePreview.src = '';
      cameraInput.value = '';
      galleryInput.value = '';
    });

    btnClearText.addEventListener('click', () => recognizedText.value = '');

    // 壓縮相片至最佳尺寸以確保上傳速度與辨識品質
    function compressImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1200;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          compressCanvas.width = w;
          compressCanvas.height = h;
          const ctx = compressCanvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(compressCanvas.toDataURL('image/jpeg', 0.85));
        };
        const reader = new FileReader();
        reader.onload = (e) => img.src = e.target.result;
        reader.readAsDataURL(file);
      });
    }

    async function handleImage(file) {
      if (!file) return;

      const base64DataUrl = await compressImage(file);
      imagePreview.src = base64DataUrl;
      previewContainer.classList.remove('hidden');

      ocrProgressBox.classList.remove('hidden');
      ocrProgressBar.style.width = '30%';
      ocrStatusText.innerText = '正在上傳分析中 (繁中/英文)...';

      try {
        const formData = new FormData();
        formData.append('base64Image', base64DataUrl);
        formData.append('language', 'cht'); // 繁體中文 + 英文
        formData.append('isOverlayRequired', 'false');
        formData.append('detectOrientation', 'true');
        formData.append('scale', 'true');
        formData.append('OCREngine', '2'); // 引擎 2 對多語言及手寫混排支援度更佳

        const response = await fetch('https://api.ocr.space/parse/image', {
          method: 'POST',
          headers: { 'apikey': customApiKey },
          body: formData
        });

        ocrProgressBar.style.width = '80%';
        const data = await response.json();

        if (data.ParsedResults && data.ParsedResults.length > 0) {
          const parsed = data.ParsedResults[0].ParsedText.trim();
          recognizedText.value = parsed || '（未能辨識到文字，請保持水平重新拍攝）';
          ocrProgressBar.style.width = '100%';
          ocrStatusText.innerText = '掃描完成！';
        } else {
          throw new Error(data.ErrorMessage ? data.ErrorMessage.join(', ') : '解析失敗');
        }
      } catch (err) {
        console.error(err);
        alert('OCR 解析發生問題：' + err.message + '\n如果預設通道繁忙，建議點右上角免費登記專屬 API Key。');
        ocrStatusText.innerText = '辨識出錯';
      }

      setTimeout(() => ocrProgressBox.classList.add('hidden'), 1000);
    }

    // 載入系統 TTS 語音
    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
      if (!availableVoices.length) return;

      voiceSelect.innerHTML = '';
      const cantoneseVoices = [];
      const englishVoices = [];

      availableVoices.forEach(v => {
        const lang = v.lang.replace('_', '-');
        const name = v.name.toLowerCase();
        if (lang === 'zh-HK' || lang === 'yue' || lang === 'zh-yue' || name.includes('cantonese') || name.includes('hong kong') || name.includes('香港')) {
          cantoneseVoices.push(v);
        } else if (lang.startsWith('en')) {
          englishVoices.push(v);
        }
      });

      const cantoneseGroup = document.createElement('optgroup');
      cantoneseGroup.label = '🇭🇰 粵語 (Cantonese)';
      if (cantoneseVoices.length > 0) {
        cantoneseVoices.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.name;
          opt.textContent = `粵語 - ${v.name}`;
          cantoneseGroup.appendChild(opt);
        });
      } else {
        const opt = document.createElement('option');
        opt.value = "";
        opt.textContent = "系統暫無專屬粵語 (將使用預設中文朗讀)";
        cantoneseGroup.appendChild(opt);
      }
      voiceSelect.appendChild(cantoneseGroup);

      const englishGroup = document.createElement('optgroup');
      englishGroup.label = '🌐 英語口音 (English Accents)';
      englishVoices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        let accentLabel = '英語';
        const lang = v.lang.replace('_', '-');
        if (lang === 'en-US') accentLabel = '🇺🇸 美國 (US)';
        else if (lang === 'en-GB') accentLabel = '🇬🇧 英國 (UK)';
        else if (lang === 'en-AU') accentLabel = '🇦🇺 澳洲 (AU)';
        else if (lang === 'en-CA') accentLabel = '🇨🇦 加拿大 (CA)';
        else if (lang === 'en-IN') accentLabel = '🇮🇳 印度 (IN)';
        else if (lang === 'en-IE') accentLabel = '🇮🇪 愛爾蘭 (IE)';
        else if (lang === 'en-NZ') accentLabel = '🇳🇿 紐西蘭 (NZ)';
        else if (lang === 'en-ZA') accentLabel = '🇿🇦 南非 (ZA)';
        opt.textContent = `${accentLabel} - ${v.name}`;
        englishGroup.appendChild(opt);
      });
      voiceSelect.appendChild(englishGroup);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    speedButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        speedButtons.forEach(b => {
          b.className = 'speed-btn py-2 px-3 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50';
        });
        btn.className = 'speed-btn py-2 px-3 rounded-lg border border-indigo-600 bg-indigo-50 text-xs font-semibold text-indigo-700';
        currentRate = parseFloat(btn.dataset.speed);
      });
    });

    btnPlay.addEventListener('click', () => {
      const text = recognizedText.value.trim();
      if (!text) {
        alert('請先拍照或在文字框輸入文字！');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = currentRate;

      const selectedVoiceName = voiceSelect.value;
      if (selectedVoiceName) {
        const found = availableVoices.find(v => v.name === selectedVoiceName);
        if (found) utterance.voice = found;
      }

      utterance.onstart = () => {
        btnPlay.classList.add('loading-pulse');
        btnPlay.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>朗讀中...</span>';
      };
      utterance.onend = utterance.onerror = () => {
        btnPlay.classList.remove('loading-pulse');
        btnPlay.innerHTML = '<i class="fa-solid fa-volume-high"></i><span>開始朗讀</span>';
      };
      window.speechSynthesis.speak(utterance);
    });

    btnStop.addEventListener('click', () => {
      window.speechSynthesis.cancel();
      btnPlay.classList.remove('loading-pulse');
      btnPlay.innerHTML = '<i class="fa-solid fa-volume-high"></i><span>開始朗讀</span>';
    });
  </script>
</body>
</html>
